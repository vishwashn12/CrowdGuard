# Circular venue, six gates on a perimeter ring.
#
# No gate declares a camera_id here. Gates start unmonitored and an operator
# binds footage to them at runtime by uploading to /api/gates/<gate_id>/upload.
# An unmonitored gate is still part of the topology: its capacity is known, so
# it remains a legal diversion target, scored with the neutral occupancy from
# DecisionConfig.assumed_unmonitored_utilization and penalised relative to a
# gate we can actually see.
#
# auto_circular_connections derives the ring from position_index, so every
# diversion route runs along the outer concourse rather than across the event
# grounds. With radius 120 m and six gates, each arc is about 126 m.

venue:
  id: demo_venue
  name: Circular Demo Venue

  geometry:
    type: circular
    radius_m: 120

  auto_circular_connections: true

  gates:
    - gate_id: G1
      name: North Gate
      capacity: 200
      position_index: 0

    - gate_id: G2
      name: North-East Gate
      capacity: 200
      position_index: 1

    - gate_id: G3
      name: South-East Gate
      capacity: 200
      position_index: 2

    - gate_id: G4
      name: South Gate
      capacity: 200
      position_index: 3

    - gate_id: G5
      name: South-West Gate
      capacity: 200
      position_index: 4

    - gate_id: G6
      name: North-West Gate
      capacity: 200
      position_index: 5
